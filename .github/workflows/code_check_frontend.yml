name: Frontend Test, Lint & Type Check

on:
  push:
    paths:
      - govtool/frontend/**
      - .github/workflows/code_check_frontend.yml
      - tests/govtool-frontend/playwright/**

defaults:
  run:
    working-directory: govtool/frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify frontend source changes
        id: paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
        working-directory: .
        shell: bash
        run: |
          # A new branch has no previous commit, and a force push leaves the
          # previous one unfetchable: check everything rather than guess.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- govtool/frontend .github/workflows/code_check_frontend.yml)"
            if [[ -n "$changed_files" ]]; then
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            else
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  browser_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "./govtool/frontend/.nvmrc"
          registry-url: "https://registry.npmjs.org/"
          scope: "@intersect.mbo"
          cache: npm
          cache-dependency-path: |
            govtool/frontend/package-lock.json
            tests/govtool-frontend/playwright/package-lock.json
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: tests/govtool-frontend/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/govtool-frontend/playwright
      - name: CIP-179 browser checks
        run: npm run test:cip179
        working-directory: tests/govtool-frontend/playwright
      - name: Governance action browser checks
        if: ${{ !cancelled() }}
        run: npm run test:governance-action-aggregates
        working-directory: tests/govtool-frontend/playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-playwright-results
          path: |
            tests/govtool-frontend/playwright/test-results/cip179
            tests/govtool-frontend/playwright/test-results/governance-actions-aggregates

  test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: govtool/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('govtool/frontend/package-lock.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version-file: "./govtool/frontend/.nvmrc"
          scope: "@intersect.mbo"
      - run: npm ci

      - name: 🧪 Test
        run: |
          npm run test

  lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: govtool/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('govtool/frontend/package-lock.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version-file: "./govtool/frontend/.nvmrc"
          scope: "@intersect.mbo"
      - run: npm ci

      - name: 👕 Lint
        run: |
          npm run lint

  type_check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: govtool/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('govtool/frontend/package-lock.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version-file: "./govtool/frontend/.nvmrc"
          scope: "@intersect.mbo"
      - run: npm ci

      - name: 🔍 Type Check
        run: |
          npm run tsc
