name: Build Docker Images

on:
  push:
    branches:
      - main
      - develop
      - test
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.ref_type == 'tag' ||
      contains(fromJson('["main", "develop", "test"]'), github.ref_name)

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: govtool-backend
            workdir: ./govtool/backend
            dockerfile: ./govtool/backend/Dockerfile
            image: ghcr.io/${{ github.repository }}-backend

          - name: govtool-frontend
            workdir: ./govtool/frontend
            dockerfile: ./govtool/frontend/Dockerfile
            image: ghcr.io/${{ github.repository }}-frontend

          - name: govtool-metadata-validation
            workdir: ./govtool/metadata-validation
            dockerfile: ./govtool/metadata-validation/Dockerfile
            image: ghcr.io/${{ github.repository }}-metadata-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image and tag
        id: vars
        run: |
          IMAGE=$(echo "${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          TAG="${{ github.sha }}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "IMAGE=$IMAGE"
          echo "BRANCH=$BRANCH"
          echo "TAG=$TAG"
          echo "FULL_IMAGE=$IMAGE:$TAG"
          
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.sha }}

            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}

            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Print generated Docker tags
        run: |
          echo "Generated Docker tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Lint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          failure-threshold: error
          format: json
          dockerfile: ${{ matrix.dockerfile }}

      - name: Save Hadolint output
        if: always()
        run: |
          cd ${{ matrix.workdir }}
          echo "$HADOLINT_RESULTS" | jq '.' > hadolint_output.json || true

      - name: Run app lint
        run: |
          cd ${{ matrix.workdir }}

          if [ -f lint.sh ]; then
            chmod +x lint.sh
            ./lint.sh
          else
            echo "No lint.sh found, skipping app lint"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.workdir }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Scan Docker image with Dockle
        run: |
          wget -q https://github.com/goodwithtech/dockle/releases/download/v0.4.14/dockle_0.4.14_Linux-64bit.tar.gz
          tar zxf dockle_0.4.14_Linux-64bit.tar.gz
          sudo mv dockle /usr/local/bin

          dockle \
            --exit-code 1 \
            --exit-level fatal \
            --format json \
            -ak GHC_RELEASE_KEY \
            -ak CABAL_INSTALL_RELEASE_KEY \
            -ak STACK_RELEASE_KEY \
            -ak KEY_SHA512 \
            --output ${{ matrix.workdir }}/dockle_scan_output.json \
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}

          cat ${{ matrix.workdir }}/dockle_scan_output.json

      - name: Push Docker images to GHCR
        run: |
          docker image push --all-tags "${{ steps.vars.outputs.image }}"