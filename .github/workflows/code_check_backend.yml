name: Backend Lint & Format Check

on:
  workflow_dispatch:
  push:
    paths:
      - govtool/govtool-backend/**
      - govtool/govtool-data-providers/**
      - govtool/govtool-provider-*/**
      - govtool/govtool-pinning-*/**
      - govtool/govtool-metadata-http/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # file: dependencies resolve to built dist, so each is built before the backend.
      - name: Build dependencies
        working-directory: govtool
        run: |
          for p in govtool-data-providers govtool-provider-fixture govtool-provider-dbsync \
                   govtool-provider-koios govtool-provider-blockfrost govtool-pinning-pinata \
                   govtool-pinning-test govtool-metadata-http; do
            (cd "$p" && npm ci && npm run build)
          done

      - name: Install backend
        working-directory: govtool/govtool-backend
        run: npm ci

      - name: Format, lint, typecheck, test and build
        working-directory: govtool/govtool-backend
        run: npm run verify
