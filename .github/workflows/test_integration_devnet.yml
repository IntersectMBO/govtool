name: Integration tests (devnet)

# Runs the backend (pytest) and frontend (Playwright) integration suites
# against a local Cardano devnet (tests/devnet): adaup's cardano-node, Kuber
# and db-sync, plus GovTool's app stack built from this commit. Nothing
# reaches a public network, hosted Kuber, Blockfrost, a faucet or Pinata,
# and no secrets are needed.

on:
  push:
    branches: [dev, draft/govtool-provider-layer]
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites to run"
        type: choice
        default: "both"
        options: ["both", "pytest", "playwright"]
      playwright_args:
        description: "Extra Playwright arguments"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # adaup provides `cardano devnet --docker` (from 0.3.0, on PyPI).
  ADAUP_VERSION: 0.3.0
  SUITES: ${{ inputs.suites || 'both' }}
  DEVNET_STATE_DIR: ${{ github.workspace }}/tests/devnet/.state

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/govtool-frontend/playwright/package-lock.json
            tests/devnet/blockfrost-shim/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/govtool-backend/requirements.txt

      - name: Install adaup
        run: |
          pip install "adaup==${ADAUP_VERSION}"
          cardano devnet --help >/dev/null

      # The chain images (cardano-node, Kuber, db-sync, Postgres) are about
      # 3 GB; keep them in the Actions cache, keyed on the adaup ref.
      - name: Chain image list
        id: chain-images
        run: |
          images="$(python - <<'EOF'
          from adaup.commands import devnet_docker as d
          print(" ".join([d.NODE_IMAGE, d.KUBER_IMAGE, d.DBSYNC_IMAGE, d.POSTGRES_IMAGE]))
          EOF
          )"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "key=chain-images-$(echo "$images" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore chain images
        id: chain-cache
        uses: actions/cache@v4
        with:
          path: /tmp/chain-images.tar.zst
          key: ${{ steps.chain-images.outputs.key }}

      - name: Load or pull chain images
        env:
          IMAGES: ${{ steps.chain-images.outputs.images }}
          CACHE_HIT: ${{ steps.chain-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            zstd -dc /tmp/chain-images.tar.zst | docker load
          else
            for image in $IMAGES; do docker pull -q "$image"; done
            docker save $IMAGES | zstd -T0 -3 -o /tmp/chain-images.tar.zst
          fi

      - name: Install Playwright dependencies
        working-directory: tests/govtool-frontend/playwright
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/govtool-frontend/playwright/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: tests/govtool-frontend/playwright
        run: npx playwright install --with-deps chromium

      - name: Install pytest dependencies
        working-directory: tests/govtool-backend
        run: pip install -r requirements.txt

      - name: Blockfrost shim unit tests
        working-directory: tests/devnet/blockfrost-shim
        run: npm ci --no-audit --no-fund && npm test

      # App images are built from source with a BuildKit layer cache in the
      # Actions cache; up.sh then starts them without rebuilding.
      - uses: docker/setup-buildx-action@v3

      - name: Expose the Actions cache to BuildKit
        uses: crazy-max/ghaction-github-runtime@v3

      # Bake resolves the compose file's build contexts from the working
      # directory, not from the file's own directory.
      - name: Build app images
        working-directory: tests/devnet
        run: |
          source lib.sh
          load_env
          docker buildx bake --file docker-compose.yml --load \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'

      - name: Start devnet and app stack
        id: up
        env:
          DEVNET_COMPOSE_BUILD: "0"
        run: tests/devnet/up.sh

      - name: pytest
        id: pytest
        if: ${{ steps.up.outcome == 'success' && env.SUITES != 'playwright' }}
        run: |
          mkdir -p test-reports
          tests/devnet/run-tests.sh pytest --junitxml="$GITHUB_WORKSPACE/test-reports/pytest.xml"

      - name: Playwright
        if: ${{ !cancelled() && steps.up.outcome == 'success' && env.SUITES != 'pytest' }}
        env:
          PLAYWRIGHT_ARGS: ${{ inputs.playwright_args }}
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ${{ github.workspace }}/test-reports/playwright.xml
        # PLAYWRIGHT_ARGS is split on spaces on purpose; it comes from a
        # workflow_dispatch input, never from untrusted event data.
        run: |
          mkdir -p test-reports
          tests/devnet/run-tests.sh playwright --reporter=line,junit,allure-playwright $PLAYWRIGHT_ARGS

      - name: Collect logs
        if: always()
        run: |
          mkdir -p devnet-logs
          cp tests/devnet/.state/timings.txt tests/devnet/.state/seed-*.json devnet-logs/ 2>/dev/null || true
          bash -c 'source tests/devnet/lib.sh; load_env; compose logs --no-color' > devnet-logs/app.log 2>&1 || true
          (cd ~/.cardano/devnet-docker 2>/dev/null && docker compose logs --no-color) > devnet-logs/chain.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-test-results
          path: |
            devnet-logs/
            test-reports/
            tests/govtool-frontend/playwright/allure-results/
            tests/govtool-frontend/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop
        if: always()
        run: tests/devnet/down.sh
