# Proposal discussion forum (PDF) backend with its own Postgres.
#
#   docker compose up -d --build
#   curl http://127.0.0.1:1337/health
#   curl http://127.0.0.1:1337/api/governance-action-types
#
# On start the backend runs `prisma migrate deploy`, then the idempotent
# lookup seed (SPEC §6), then listens. Demo data for Playwright (§11.5) is
# never loaded automatically:
#   docker compose exec backend node dist/seed/demo.js
#
# Local Playwright runs add docker-compose.test.yml (private-URL proxy for
# the test bucket on the host); see its header.
#
# Postgres is published on 127.0.0.1:5442 so `npm run start:dev`,
# `npm run prisma:migrate` and `npm run test:e2e` (database pdf_test) on the
# host can use .env.example as-is.
#
# JWT_SECRET and REFRESH_SECRET below are DEVELOPMENT VALUES, public in this
# file. Any real deployment must override them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdf
      POSTGRES_PASSWORD: pdf
      POSTGRES_DB: pdf
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pdf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf -d pdf"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://pdf:pdf@db:5432/pdf?schema=public
      HOST: 0.0.0.0
      PORT: 1337
      JWT_SECRET: ${JWT_SECRET:-dev-only-access-secret-change-me-0123456789}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-only-refresh-secret-change-me-012345678}
      JWT_SECRET_EXPIRES: ${JWT_SECRET_EXPIRES:-1h}
      REFRESH_TOKEN_EXPIRES: ${REFRESH_TOKEN_EXPIRES:-7d}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CHALLENGE_TTL_SECONDS: ${CHALLENGE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      CARDANO_NETWORK_ID: ${CARDANO_NETWORK_ID:-}
      # Unset by default (the proxy answers 503). A GovTool backend on the
      # host: GOVTOOL_API_BASE_URL=http://host.docker.internal:9999
      GOVTOOL_API_BASE_URL: ${GOVTOOL_API_BASE_URL:-}
      GOVTOOL_PROXY_ALLOWED_PATHS: ${GOVTOOL_PROXY_ALLOWED_PATHS:-proposal/enacted-details}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-10000}
      PROXY_MAX_BYTES: ${PROXY_MAX_BYTES:-5242880}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-https://ipfs.io/ipfs}
      BODY_LIMIT: ${BODY_LIMIT:-1mb}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pdf-db:
