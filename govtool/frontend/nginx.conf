# RESOLVER_CONFIG
# UMAMI_UPSTREAM_CONFIG
# SEO_UPSTREAM_CONFIG

# Pages are revalidated on every visit, so no cache can serve one page's SEO
# tags on another URL; hashed assets keep their default caching.
map $sent_http_content_type $page_cache_control {
  ~^text/html "no-cache";
  default "";
}

log_format proxied_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'xff="$http_x_forwarded_for"';

server {
  listen 80;
  access_log /var/log/nginx/access.log proxied_combined;
  root /usr/share/nginx/html;
  error_page 503 @maintenance;
  add_header Cache-Control $page_cache_control;
  # SEO_SERVER_CONFIG
  # Relative Location headers: behind the TLS gateway an absolute one would
  # name this server's own http:// origin.
  absolute_redirect off;

  # Links from before the /actions URLs move permanently, so old shares and
  # search results land on the new address and keep their ranking. Only the
  # route names change here (LEGACY_PATH_SEGMENTS in src/consts/paths.ts); the
  # app's getCurrentUrl does the rest, such as an action named by tx hash with
  # its index after #, which the browser keeps across the redirect.
  location ~* ^/connected(/.+)$ { return 301 $1$is_args$args; }
  location ~* ^/governance_actions(/.*)?$ { return 301 /actions$1$is_args$args; }
  location ~* ^/drep_directory(/.*)?$ { return 301 /dreps$1$is_args$args; }
  location ~* ^/proposal_discussion/propose/?$ { return 301 /proposals/new$is_args$args; }
  location ~* ^/proposal_discussion/proposal_comment_review(/.*)?$ { return 301 /proposals/comment-review$1$is_args$args; }
  location ~* ^/proposal_discussion(/.*)?$ { return 301 /proposals$1$is_args$args; }
  location ~* ^/budget_discussion(/.*)?$ { return 301 /budget$1$is_args$args; }
  location ~* ^/create_governance_action/?$ { return 301 /actions/new$is_args$args; }
  location ~* ^/edit_drep/?$ { return 301 /my/drep/edit$is_args$args; }
  location ~* ^/register_drep/?$ { return 301 /my/drep/register$is_args$args; }
  location ~* ^/retire_drep/?$ { return 301 /my/drep/retire$is_args$args; }
  location ~* ^/register_direct_voter/?$ { return 301 /my/direct-voter/register$is_args$args; }
  location ~* ^/retire_direct_voter/?$ { return 301 /my/direct-voter/retire$is_args$args; }
  location ~* ^/stake_keys/?$ { return 301 /my/stake-key$is_args$args; }
  location ~* ^/my/votes_and_favorites/?$ { return 301 /my/votes$is_args$args; }

  # index.html carries two SSI includes, filled from the backend's /seo
  # routes through /__seo/ below, with its own defaults as the fallback.
  location / {
    index index.html;
    try_files $uri $uri /index.html;
    ssi on;

    if (-f /var/run/maintenance_enabled) {
      return 503;
    }
  }

  # The 2025 budget proposals archive: static JSON written once by
  # scripts/split-bd-archive.mjs. The build writes a .br beside each file
  # over 10 KB, which brotli_static serves; the rest, and clients without
  # brotli, need the JSON types below (the image compresses text/html only).
  # A missing discussion must 404 rather than fall back to index.html.
  location /budget-proposals-2025/ {
    gzip_types application/json;
    gzip_vary on;
    brotli_types application/json;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Maintenance has two switches, both files in the container's /var/run
  # (see the frontend README):
  # - maintenance.json: the app stays up and shows a banner counting down to
  #   its endsAt, while transactions are refused. A 404 means no maintenance.
  # - maintenance_enabled: the whole site answers 503 with maintenance.html,
  #   for outages the app cannot run through.
  location = /maintenance.json {
    alias /var/run/maintenance.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  location /is-maintenance-mode-on {
    default_type text/html;
    if (-f /var/run/maintenance_enabled) {
      return 200 'true';
    }
    return 200 'false';
  }

  # UMAMI_PROXY_CONFIG

  # SEO_LOCATIONS_CONFIG

  location @maintenance {
    rewrite ^(.*)$ /maintenance.html break;
    return 503;
  }
}
