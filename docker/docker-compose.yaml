services:
    # The metadata service's store: fetched documents, kept by hash, and fetch
    # reports. Not published: only the metadata service connects to it.
    metadata-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: metadata
            POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?set METADATA_DB_PASSWORD in docker/.env}
            POSTGRES_DB: metadata
        volumes:
            - metadata-db:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U metadata -d metadata"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    # Resolves anchors for the backend: caches by hash, fails over across IPFS
    # gateways and refuses private addresses. Not published: only the backend
    # talks to it (D119).
    metadata:
        image: ghcr.io/intersectmbo/govtool-metadata-service:dev
        build:
            context: ../govtool/govtool-metadata-service
            dockerfile: Dockerfile
        environment:
            NODE_ENV: production
            PORT: 3000
            # The image runs `prisma migrate deploy` before starting.
            DATABASE_URL: postgresql://metadata:${METADATA_DB_PASSWORD}@metadata-db:5432/metadata
            # Optional: your own IPFS gateway, tried before the public ones.
            IPFS_PRIMARY_GATEWAY: ${IPFS_PRIMARY_GATEWAY:-}
        depends_on:
            metadata-db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        restart: unless-stopped

    govtool-backend:
        image: ghcr.io/intersectmbo/govtool-backend:dev
        build:
            # The backend depends on its sibling packages by path.
            context: ../govtool
            dockerfile: govtool-backend/Dockerfile
        env_file:
            - ./.env
        environment:
            GOVTOOL_DBSYNC_HOST: ${DBSYNC_POSTGRES_HOST}
            GOVTOOL_DBSYNC_PORT: ${DBSYNC_POSTGRES_PORT:-5432}
            GOVTOOL_DBSYNC_DATABASE: ${DBSYNC_DATABASE}
            GOVTOOL_DBSYNC_USER: ${DBSYNC_POSTGRES_USER}
            GOVTOOL_DBSYNC_PASSWORD: ${DBSYNC_POSTGRES_PASSWORD}
            # Must match the database, or every route answers 500.
            GOVTOOL_DBSYNC_NETWORK: ${DBSYNC_NETWORK:-mainnet}
            GOVTOOL_PINATA_API_JWT: ${PINATA_API_JWT:-}
            IPFS_GATEWAY: ${IPFS_GATEWAY:-}
            GOVTOOL_METADATA_SERVICE_URL: http://metadata:3000
        ports:
         - "9999:9999"
        depends_on:
            metadata:
                condition: service_healthy

    govtool-frontend:
        image: ghcr.io/intersectmbo/govtool-frontend:dev
        build: 
            context: ../govtool/frontend
            dockerfile: Dockerfile
        env_file:
            - ../govtool/frontend/.env
        environment:
            UMAMI_URL: ${UMAMI_URL:-}
            UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
            UMAMI_SSL_VERIFY: ${UMAMI_SSL_VERIFY:-true}
            TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
            REAL_IP_HEADER: ${REAL_IP_HEADER:-X-Forwarded-For}
        ports:
            - "80:80"
        depends_on:
            - govtool-backend

volumes:
    metadata-db:
