# UMAMI_UPSTREAM_CONFIG

log_format proxied_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'xff="$http_x_forwarded_for"';

server {
  listen 80;
  access_log /var/log/nginx/access.log proxied_combined;
  root /usr/share/nginx/html;
  error_page 503 @maintenance;

  location / {
    index index.html;
    try_files $uri $uri /index.html;

    if (-f /var/run/maintenance_enabled) {
      return 503;
    }
  }

  # The 2025 budget proposals archive: static JSON written once by
  # scripts/split-bd-archive.mjs. The build writes a .br beside each file
  # over 10 KB, which brotli_static serves; the rest, and clients without
  # brotli, need the JSON types below (the image compresses text/html only).
  # A missing discussion must 404 rather than fall back to index.html.
  location /budget-proposals-2025/ {
    gzip_types application/json;
    gzip_vary on;
    brotli_types application/json;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location /is-maintenance-mode-on {
    default_type text/html;
    if (-f /var/run/maintenance_enabled) {
      return 200 'true';
    }
    return 200 'false';
  }

  # UMAMI_PROXY_CONFIG

  location @maintenance {
    rewrite ^(.*)$ /maintenance.html break;
    return 503;
  }
}
