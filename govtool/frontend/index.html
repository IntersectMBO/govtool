<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/AppLogo.svg" />
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Page tags. In the image, nginx fills the include from the backend's
      /seo/head for each page, and falls back to this block; without SSI
      (the Vite dev server) these comments are inert and the block applies.
      docker-entrypoint.sh fills in the site URL, or drops the og:image line.
    -->
    <!--# block name="seo_head_default" -->
    <title data-seo>Cardano GovTool</title>
    <meta name="description" content="Take part in Cardano on-chain governance: read and vote on governance actions, delegate to a DRep, or become one." data-seo />
    <meta property="og:type" content="website" data-seo />
    <meta property="og:site_name" content="Cardano GovTool" data-seo />
    <meta property="og:title" content="Cardano GovTool" data-seo />
    <meta property="og:description" content="Take part in Cardano on-chain governance: read and vote on governance actions, delegate to a DRep, or become one." data-seo />
    <meta property="og:image" content="__SITE_URL__/images/og-default.png" data-seo />
    <meta property="og:image:width" content="1200" data-seo />
    <meta property="og:image:height" content="630" data-seo />
    <meta name="twitter:card" content="summary_large_image" data-seo />
    <!--# endblock -->
    <!--# include virtual="/__seo/head" stub="seo_head_default" -->
    <style>
      html,
      body {
        margin: 0;
        overscroll-behavior-y: none;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!--# block name="seo_body_default" --><!--# endblock -->
    <div id="root"><!--# include virtual="/__seo/body" stub="seo_body_default" --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
